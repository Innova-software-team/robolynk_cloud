# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: robolynk-dev
context: {}

entries:
  # 1) Service account user
  - id: dev-robolynk-user              # blueprint-internal name for !KeyOf
    model: authentik_core.user
    state: present
    identifiers:
      username: dev-robolynk-user      # stable lookup, no DB PKs
    attrs:
      username: dev-robolynk-user
      name: dev-robolynk-user
      is_active: true
      type: service_account
      path: goauthentik.io/service-accounts
      attributes:
        goauthentik.io/user/token-expires: true

  # 2) OAuth2/OIDC provider
  - id: robolynk-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Provider for Robolynk Cloud
    attrs:
      name: Provider for Robolynk Cloud
      client_type: confidential
      client_id: cufoG0Y4ljAYVLmLUqozRfuEm0alhrlerZXV7T03
      client_secret: AHHIVVPp5RLPrZJpMMVyryH1hLNGjhhHz2w5Nxap2AegsrGOUvflSbee6NaSjhoxyU3VGICr2emCyD7Q31VIo87zuvAyziThSHdx9d4xf640D
      issuer_mode: per_provider
      include_claims_in_id_token: true
      logout_method: backchannel
      sub_mode: hashed_user_id

      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      refresh_token_threshold: hours=1

      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8080/auth/callback

      # Use the default authorization/invalidation flows by slug,
      # so this stays valid across DB resets.
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      # Default OIDC scopes via the system scopemapping blueprints
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

      # Use the default self-signed cert as signing key
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]

  # 3) Application pointing at the provider
  - model: authentik_core.application
    state: present
    identifiers:
      slug: robolynk            # stable, human-chosen
    attrs:
      name: Robolynk Cloud
      slug: robolynk
      policy_engine_mode: any
      provider: !KeyOf robolynk-provider

  # 4) Service account app token (fixed key for dev)
  - id: dev-robolynk-token
    model: authentik_core.token
    state: present
    identifiers:
      # Use a stable identifier instead of DB PKs
      identifier: dev-robolynk-token
    attrs:
      # Bind the token to the service account user from entry #1
      user: !KeyOf dev-robolynk-user
      intent: app_password
      # Optional: make it non-expiring during dev. Remove or set to true if you prefer expiring tokens.
      expiring: false

      # IMPORTANT: replace this placeholder with your actual exported token key
      # (the long random string you use as the Bearer token).
      key: "FtdaKAcNEd1EMmVBKlawhor6Z4hbqFrUCWY8IG5zyQ21RCPdNcGLxoqtME7E"
