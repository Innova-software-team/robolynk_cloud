# Application
spring.application.name=RestaurantSevices

# Database connection
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5434}/${PG_DB:robolynk-foods-db}
spring.datasource.username=${PG_USER:robolynk-foods}
spring.datasource.password=${PG_PASS:notVerySecure}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Authentik OIDC/OAuth2 provider
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/application/o/robolynk/


### Debug
